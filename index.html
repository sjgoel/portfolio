<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio Tracker</title>
<style>
:root{--bg:#0b1020;--panel:#121938;--panel-2:#182149;--muted:#8f9bbf;--text:#eef3ff;--line:#27315f;--green:#16c47f;--green-bg:rgba(22,196,127,.14);--red:#ff5d73;--red-bg:rgba(255,93,115,.14);--amber:#f0b429;--amber-bg:rgba(240,180,41,.16);--blue:#66a3ff;--shadow:0 16px 40px rgba(0,0,0,.28);--radius:18px;--radius-sm:12px}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#0a0f1d,#0d1430 55%,#0a1020);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:#9ec2ff;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1520px;margin:0 auto;padding:18px}
.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.titlebox h1{margin:0;font-size:28px}
.titlebox .sub{margin-top:4px;color:var(--muted)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{appearance:none;border:1px solid var(--line);background:linear-gradient(180deg,#1c2759,#182149);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.warn{border-color:#634f16;background:linear-gradient(180deg,#3d3210,#28200a)}
.countdown{min-width:220px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:8px 12px;position:relative;overflow:hidden}
.countdown span{position:relative;z-index:2}
.countdown .bar{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,rgba(102,163,255,.28),rgba(102,163,255,.12));z-index:1}
.cards{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.card,.tablecard,.modal-card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:18px}
.tablecard{padding:12px;margin-bottom:16px}
.section-head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 14px 8px}
.section-head h3{margin:0}
.table-wrap{overflow:auto;border-radius:14px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1080px}
thead th{position:sticky;top:0;background:#141c3d;color:#b8c5ea;text-align:right;font-size:12px;padding:12px;border-bottom:1px solid var(--line)}
thead th:first-child,tbody td:first-child{text-align:left}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,.05);text-align:right}
.symbol-cell{display:flex;align-items:center;gap:8px}
.tag{padding:2px 8px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.08)}
.pos{color:var(--green)}
.neg{color:var(--red)}
</style>

<div class="wrap">
<div class="topbar">
<div class="titlebox">
<h1>Portfolio Tracker</h1>
<div class="sub">Local-first tracker with Yahoo Finance prices + GitHub Gist sync</div>
</div>
<div class="actions">
<button id="refreshBtn">Refresh</button>
</div>
</div>

<div class="cards">
<div class="card" id="usCard"></div>
<div class="card" id="indiaCard"></div>
</div>

<div class="tablecard">
<div class="section-head"><h3>US Positions</h3></div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>SYMBOL</th>
<th>LTP</th>
<th>UNITS</th>
<th>AVG</th>
<th>INVESTED</th>
<th>VALUE</th>
<th>TOTAL P/L</th>
<th>TODAY P/L</th>
</tr>
</thead>
<tbody id="usTableBody"></tbody>
</table>
</div>
</div>

<div class="tablecard">
<div class="section-head"><h3>India Positions</h3></div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>SYMBOL</th>
<th>LTP</th>
<th>UNITS</th>
<th>AVG</th>
<th>INVESTED</th>
<th>VALUE</th>
<th>TOTAL P/L</th>
<th>TODAY P/L</th>
</tr>
</thead>
<tbody id="indiaTableBody"></tbody>
</table>
</div>
</div>
</div>

<script>
const INDIA_WRITEOFFS = 44865;

const usPositions = JSON.parse(localStorage.getItem("usPositions")||"null") || [
{symbol:"SIVR",units:463.137017,purchasePrice:73.41,note:"ROBN"},
{symbol:"GLDM",units:671.844869,purchasePrice:98.24,note:"ROBN"},
{symbol:"GLDM",units:1180.406,purchasePrice:105.9,note:"FIDL"},
{symbol:"SIVR",units:676.557,purchasePrice:84.13,note:"FIDL"},
{symbol:"SIVR",units:310,purchasePrice:82.05,note:"ROLL"}
];

const indiaPositions = JSON.parse(localStorage.getItem("indiaPositions")||"[]");

async function fetchPrice(symbol){
const urls=[
`https://api.allorigins.win/raw?url=${encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/"+symbol+"?interval=1m&range=1d")}`,
`https://corsproxy.io/?${encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/"+symbol+"?interval=1m&range=1d")}`,
`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/"+symbol+"?interval=1m&range=1d")}`
];
for(const u of urls){
try{
const r=await fetch(u);
const d=await r.json();
const meta=d.chart.result[0].meta;
let price=meta.regularMarketPrice;
const closes=d.chart.result[0].indicators.quote[0].close;
for(let i=closes.length-1;i>=0;i--){if(closes[i]!=null){price=closes[i];break;}}
return {price,prev:meta.previousClose||meta.chartPreviousClose};
}catch(e){}
}
return {price:0,prev:0};
}

function money(n,c){
if(c==="US")return "$"+n.toLocaleString("en-US",{maximumFractionDigits:n>=1000?0:2});
return "₹"+n.toLocaleString("en-IN",{maximumFractionDigits:n>=1000?0:2});
}

function units(n,c){
if(c==="US")return n.toLocaleString("en-US",{minimumFractionDigits:6,maximumFractionDigits:6});
return n.toLocaleString("en-IN",{maximumFractionDigits:0});
}

async function refresh(){
const uniqueUS=[...new Set(usPositions.map(p=>p.symbol))];
const prices={};
for(const s of uniqueUS){prices[s]=await fetchPrice(s);}

const usBody=document.getElementById("usTableBody");
usBody.innerHTML="";

let invested=0,value=0,today=0;

for(const p of usPositions){
const pr=prices[p.symbol].price;
const prev=prices[p.symbol].prev;
const inv=p.units*p.purchasePrice;
const val=p.units*pr;
const pnl=val-inv;
const todayP=p.units*(pr-prev);
invested+=inv;value+=val;today+=todayP;

usBody.innerHTML+=`
<tr>
<td class="symbol-cell"><a href="https://www.tradingview.com/chart/?symbol=${p.symbol}" target="_blank">${p.symbol}</a>${p.note?'<span class="tag">'+p.note+'</span>':''}</td>
<td>${money(pr,"US")}</td>
<td>${units(p.units,"US")}</td>
<td>${money(p.purchasePrice,"US")}</td>
<td>${money(inv,"US")}</td>
<td>${money(val,"US")}</td>
<td class="${pnl>=0?'pos':'neg'}">${money(pnl,"US")}</td>
<td class="${todayP>=0?'pos':'neg'}">${money(todayP,"US")}</td>
</tr>`;
}

document.getElementById("usCard").innerHTML=`
<b>Value:</b> ${money(value,"US")}<br>
<b>Invested:</b> ${money(invested,"US")}<br>
<b>Total P/L:</b> <span class="${value-invested>=0?'pos':'neg'}">${money(value-invested,"US")}</span>
`;

const uniqueIN=[...new Set(indiaPositions.map(p=>p.symbol))];
const pricesIN={};
for(const s of uniqueIN){pricesIN[s]=await fetchPrice(s+".NS");}

const inBody=document.getElementById("indiaTableBody");
inBody.innerHTML="";

let investedIN=INDIA_WRITEOFFS,valueIN=0;

for(const p of indiaPositions){
const pr=pricesIN[p.symbol].price;
const prev=pricesIN[p.symbol].prev;
const inv=p.units*p.purchasePrice;
const val=p.units*pr;
const pnl=val-inv;
const todayP=p.units*(pr-prev);
investedIN+=inv;valueIN+=val;

inBody.innerHTML+=`
<tr>
<td class="symbol-cell"><a href="https://www.tradingview.com/chart/?symbol=NSE:${p.symbol}" target="_blank">${p.symbol}</a></td>
<td>${money(pr,"IN")}</td>
<td>${units(p.units,"IN")}</td>
<td>${money(p.purchasePrice,"IN")}</td>
<td>${money(inv,"IN")}</td>
<td>${money(val,"IN")}</td>
<td class="${pnl>=0?'pos':'neg'}">${money(pnl,"IN")}</td>
<td class="${todayP>=0?'pos':'neg'}">${money(todayP,"IN")}</td>
</tr>`;
}

document.getElementById("indiaCard").innerHTML=`
<b>Value:</b> ${money(valueIN,"IN")}<br>
<b>Invested:</b> ${money(investedIN,"IN")}<br>
<b>Total P/L:</b> <span class="${valueIN-investedIN>=0?'pos':'neg'}">${money(valueIN-investedIN,"IN")}</span>
`;
}

document.getElementById("refreshBtn").onclick=refresh;
refresh();
setInterval(refresh,30000);
</script>
