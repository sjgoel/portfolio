name: Update portfolio prices

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: portfolio-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch portfolio prices
        run: |
          python <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          GIST_ID = "d5b128bf7d79126034c9c3816a35cd37"

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/134.0.0.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": UA,
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
          }

          def get_json(url, retries=4, timeout=20):
              last_error = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as e:
                      last_error = e
                      if attempt < retries - 1:
                          time.sleep(2 * (attempt + 1))
              raise last_error

          def nse_quote(symbol, retries=3, timeout=15):
              last_error = None
              for attempt in range(retries):
                  try:
                      s = requests.Session()
                      headers = {
                          "User-Agent": UA,
                          "Accept": "application/json, text/plain, */*",
                          "Accept-Language": "en-US,en;q=0.9",
                          "Referer": (
                              "https://www.nseindia.com/get-quotes/"
                              f"equity?symbol={urllib.parse.quote(symbol)}"
                          ),
                          "X-Requested-With": "XMLHttpRequest",
                          "Connection": "keep-alive",
                      }

                      r = s.get(
                          "https://www.nseindia.com/",
                          headers=headers,
                          timeout=timeout,
                      )
                      r.raise_for_status()
                      time.sleep(0.5)

                      url = (
                          "https://www.nseindia.com/api/quote-equity?symbol="
                          + urllib.parse.quote(symbol)
                      )

                      r = s.get(url, headers=headers, timeout=timeout)
                      r.raise_for_status()
                      data = r.json()

                      price_info = data.get("priceInfo", {}) or {}
                      metadata = data.get("metadata", {}) or {}

                      price = (
                          price_info.get("lastPrice")
                          or metadata.get("lastPrice")
                      )

                      prev_close = (
                          price_info.get("previousClose")
                          or metadata.get("previousClose")
                          or price
                      )

                      source_time = (
                          metadata.get("lastUpdateTime")
                          or metadata.get("lastUpdateTimeStamp")
                          or data.get("lastUpdateTime")
                      )

                      if price is None:
                          raise RuntimeError(
                              f"NSE returned no lastPrice for {symbol}"
                          )

                      return (
                          float(price),
                          float(prev_close) if prev_close is not None else float(price),
                          source_time,
                      )

                  except Exception as e:
                      last_error = e
                      if attempt < retries - 1:
                          time.sleep(2 * (attempt + 1))
              raise last_error

          def yahoo_quote(symbol):
              encoded = urllib.parse.quote(symbol)
              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + encoded
                  + "?interval=5m&range=1d"
              )
              data = get_json(url)
              result = data["chart"]["result"][0]
              meta = result.get("meta", {}) or {}

              price = meta.get("regularMarketPrice")
              prev_close = (
                  meta.get("previousClose")
                  or meta.get("chartPreviousClose")
                  or price
              )

              closes = []
              quote_arrays = result.get("indicators", {}).get("quote", [])

              if quote_arrays:
                  closes = [
                      round(float(x), 4)
                      for x in quote_arrays[0].get("close", [])
                      if x is not None
                  ]

              if price is None:
                  raise RuntimeError(
                      f"Yahoo returned no market price for {symbol}"
                  )

              return float(price), float(prev_close), closes[-6:]

          gist = get_json(
              f"https://api.github.com/gists/{GIST_ID}"
          )

          files = gist.get("files", {})
          portfolio_text = None

          for filename in ["gistfile1.txt", "portfolio.json"]:
              if filename in files:
                  content = files[filename].get("content", "").strip()
                  if content and content != "{}":
                      portfolio_text = content
                      break

          if not portfolio_text:
              raise RuntimeError(
                  "Could not find portfolio data in Gist"
              )

          portfolio = json.loads(portfolio_text)

          us_positions = portfolio.get("usPositions", [])
          india_positions = portfolio.get("indiaPositions", [])

          old_quotes = {}

          try:
              old_data = json.loads(
                  Path("prices.json").read_text()
              )
              old_quotes = old_data.get("quotes", {})
          except Exception:
              pass

          quotes = {}
          errors = {}
          seen = set()

          for p in us_positions:
              symbol = str(
                  p.get("symbol", "")
              ).strip().upper()

              if not symbol or symbol in seen:
                  continue

              seen.add(symbol)

              try:
                  price, prev_close, sparkline = yahoo_quote(symbol)

                  quotes[symbol] = {
                      "price": round(price, 4),
                      "prevClose": round(prev_close, 4),
                      "sparkline": sparkline,
                      "yahooSymbol": symbol,
                      "source": "Yahoo",
                      "stale": False,
                  }

                  print(
                      f"{symbol} [Yahoo]: "
                      f"{quotes[symbol]['price']}"
                  )

              except Exception as e:
                  errors[symbol] = f"Yahoo: {e}"
                  print(
                      f"WARNING: {symbol} Yahoo failed: {e}"
                  )

                  if symbol in old_quotes:
                      old = dict(old_quotes[symbol])
                      old["stale"] = True
                      old["source"] = old.get("source", "Yahoo")
                      quotes[symbol] = old

          for p in india_positions:
              symbol = str(
                  p.get("symbol", "")
              ).strip().upper()

              if not symbol or symbol in seen:
                  continue

              seen.add(symbol)

              try:
                  price, prev_close, source_time = nse_quote(symbol)

                  old_sparkline = []
                  if symbol in old_quotes:
                      old_sparkline = old_quotes[symbol].get("sparkline", [])

                  quotes[symbol] = {
                      "price": round(price, 4),
                      "prevClose": round(prev_close, 4),
                      "sparkline": old_sparkline,
                      "yahooSymbol": symbol + ".NS",
                      "source": "NSE",
                      "sourceTime": source_time,
                      "stale": False,
                  }

                  print(
                      f"{symbol} [NSE]: "
                      f"{quotes[symbol]['price']} "
                      f"(NSE time: {source_time})"
                  )

              except Exception as e:
                  errors[symbol] = f"NSE: {e}"
                  print(
                      f"WARNING: {symbol} NSE failed: {e}"
                  )

                  if symbol in old_quotes:
                      old = dict(old_quotes[symbol])
                      old["stale"] = True
                      old["source"] = old.get("source", "NSE")
                      quotes[symbol] = old

          if not quotes:
              raise RuntimeError(
                  "No prices could be obtained and no previous prices exist"
              )

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "quotes": quotes,
          }

          if errors:
              output["errors"] = errors

          Path("prices.json").write_text(
              json.dumps(
                  output,
                  indent=2,
                  sort_keys=True,
              ) + "\n"
          )

          print()
          print(f"Updated {len(quotes)} symbols")

          if errors:
              print(f"Errors: {len(errors)}")

          PY

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp prices.json /tmp/prices.json

          for attempt in 1 2 3
          do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/prices.json prices.json
            git add prices.json

            if git diff --cached --quiet
            then
              echo "No price changes to commit"
              exit 0
            fi

            git commit -m "Update portfolio prices"

            if git push origin HEAD:main
            then
              echo "Prices successfully pushed"
              exit 0
            fi

            echo "Repository changed during push. Retrying..."
            sleep 3
          done

          echo "Unable to push after 3 attempts"
          exit 1
