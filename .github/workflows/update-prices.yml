name: Update portfolio prices

on:
  workflow_dispatch: {}
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: portfolio-price-update
  cancel-in-progress: false
jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch portfolio prices
        run: |
          python <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          GIST_ID = "d5b128bf7d79126034c9c3816a35cd37"

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/134.0.0.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": UA,
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
          }

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          def get_json(url, retries=4, timeout=20):
              last_error = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as e:
                      last_error = e
                      if attempt < retries - 1:
                          time.sleep(2 * (attempt + 1))
              raise last_error

          def tradingview_india_quote(symbol, timeout=15):
              url = "https://scanner.tradingview.com/india/scan"
              payload = {
                  "symbols": {
                      "tickers": [f"NSE:{symbol}"],
                      "query": {"types": []},
                  },
                  "columns": ["close", "change"],
              }
              headers = {
                  "User-Agent": UA,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "Origin": "https://in.tradingview.com",
                  "Referer": "https://in.tradingview.com/",
              }
              r = requests.post(url, json=payload, headers=headers, timeout=timeout)
              r.raise_for_status()
              data = r.json()
              rows = data.get("data") or []
              if not rows:
                  raise RuntimeError(f"TradingView returned no row for NSE:{symbol}")
              values = rows[0].get("d") or []
              if not values or values[0] is None:
                  raise RuntimeError(f"TradingView returned no close for NSE:{symbol}")

              price = float(values[0])
              change_pct = None
              if len(values) > 1 and values[1] is not None:
                  change_pct = float(values[1])

              if change_pct is not None and abs(100.0 + change_pct) > 0.000001:
                  prev_close = price / (1.0 + change_pct / 100.0)
              else:
                  prev_close = price

              return price, prev_close

          def nse_quote(symbol, retries=2, timeout=15):
              last_error = None
              for attempt in range(retries):
                  try:
                      s = requests.Session()
                      headers = {
                          "User-Agent": UA,
                          "Accept": "application/json, text/plain, */*",
                          "Accept-Language": "en-US,en;q=0.9",
                          "Referer": (
                              "https://www.nseindia.com/get-quotes/"
                              f"equity?symbol={urllib.parse.quote(symbol)}"
                          ),
                          "Connection": "keep-alive",
                      }
                      prime = s.get(
                          "https://www.nseindia.com/",
                          headers=headers,
                          timeout=timeout,
                      )
                      prime.raise_for_status()
                      time.sleep(0.5)

                      url = (
                          "https://www.nseindia.com/api/quote-equity?symbol="
                          + urllib.parse.quote(symbol)
                      )
                      r = s.get(url, headers=headers, timeout=timeout)
                      r.raise_for_status()
                      data = r.json()

                      price_info = data.get("priceInfo", {}) or {}
                      metadata = data.get("metadata", {}) or {}

                      price = price_info.get("lastPrice") or metadata.get("lastPrice")
                      prev_close = (
                          price_info.get("previousClose")
                          or metadata.get("previousClose")
                          or price
                      )

                      if price is None:
                          raise RuntimeError(f"NSE returned no lastPrice for {symbol}")

                      return float(price), float(prev_close)

                  except Exception as e:
                      last_error = e
                      if attempt < retries - 1:
                          time.sleep(2)
              raise last_error

          def yahoo_quote(symbol, interval="1m"):
              encoded = urllib.parse.quote(symbol)
              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + encoded
                  + f"?interval={interval}&range=1d"
              )

              data = get_json(url)
              result = data["chart"]["result"][0]
              meta = result.get("meta", {}) or {}

              timestamps = result.get("timestamp") or []
              quote_arrays = result.get("indicators", {}).get("quote", [])

              closes = []
              timed_closes = []

              if quote_arrays:
                  raw_closes = quote_arrays[0].get("close", []) or []
                  for i, value in enumerate(raw_closes):
                      if value is None:
                          continue
                      value = float(value)
                      closes.append(round(value, 4))
                      if i < len(timestamps):
                          timed_closes.append((int(timestamps[i]), value))

              if timed_closes:
                  ts, price = timed_closes[-1]
                  quote_time = datetime.fromtimestamp(
                      ts, tz=timezone.utc
                  ).isoformat()
              elif closes:
                  price = float(closes[-1])
                  quote_time = utc_now()
              else:
                  price = meta.get("regularMarketPrice")
                  quote_time = utc_now()

              if price is None:
                  raise RuntimeError(f"Yahoo returned no usable price for {symbol}")

              prev_close = (
                  meta.get("previousClose")
                  or meta.get("chartPreviousClose")
                  or price
              )

              return float(price), float(prev_close), closes[-6:], quote_time

          gist = get_json(f"https://api.github.com/gists/{GIST_ID}")

          files = gist.get("files", {})
          portfolio_text = None

          for filename in ["gistfile1.txt", "portfolio.json"]:
              if filename in files:
                  content = files[filename].get("content", "").strip()
                  if content and content != "{}":
                      portfolio_text = content
                      break

          if not portfolio_text:
              raise RuntimeError("Could not find portfolio data in Gist")

          portfolio = json.loads(portfolio_text)
          us_positions = portfolio.get("usPositions", [])
          india_positions = portfolio.get("indiaPositions", [])

          old_data = {}
          old_quotes = {}

          try:
              old_data = json.loads(Path("prices.json").read_text())
              old_quotes = old_data.get("quotes", {})
          except Exception:
              pass

          quotes = {}
          errors = {}
          used_stale_fallback = False
          seen = set()

          for p in us_positions:
              symbol = str(p.get("symbol", "")).strip().upper()
              if not symbol or symbol in seen:
                  continue
              seen.add(symbol)

              try:
                  price, prev_close, sparkline, quote_time = yahoo_quote(
                      symbol, interval="1m"
                  )
                  quotes[symbol] = {
                      "price": round(price, 4),
                      "prevClose": round(prev_close, 4),
                      "sparkline": sparkline,
                      "yahooSymbol": symbol,
                      "source": "Yahoo",
                      "quoteUpdated": quote_time,
                      "stale": False,
                  }
                  print(
                      f"{symbol} [Yahoo]: "
                      f"{quotes[symbol]['price']} @ {quote_time}"
                  )
              except Exception as e:
                  errors[symbol] = f"Yahoo: {e}"
                  print(f"WARNING: {symbol} Yahoo failed: {e}")
                  if symbol in old_quotes:
                      used_stale_fallback = True
                      old = dict(old_quotes[symbol])
                      old["stale"] = True
                      quotes[symbol] = old

          for p in india_positions:
              symbol = str(p.get("symbol", "")).strip().upper()
              if not symbol or symbol in seen:
                  continue
              seen.add(symbol)

              old_sparkline = []
              if symbol in old_quotes:
                  old_sparkline = old_quotes[symbol].get("sparkline", [])

              try:
                  price, prev_close = tradingview_india_quote(symbol)
                  quote_time = utc_now()
                  quotes[symbol] = {
                      "price": round(price, 4),
                      "prevClose": round(prev_close, 4),
                      "sparkline": old_sparkline,
                      "yahooSymbol": symbol + ".NS",
                      "source": "TradingView",
                      "quoteUpdated": quote_time,
                      "stale": False,
                  }
                  print(
                      f"{symbol} [TradingView]: "
                      f"{quotes[symbol]['price']}"
                  )
                  continue
              except Exception as e:
                  print(f"WARNING: {symbol} TradingView failed: {e}")
                  errors[symbol] = f"TradingView: {e}"

              try:
                  price, prev_close = nse_quote(symbol)
                  quote_time = utc_now()
                  quotes[symbol] = {
                      "price": round(price, 4),
                      "prevClose": round(prev_close, 4),
                      "sparkline": old_sparkline,
                      "yahooSymbol": symbol + ".NS",
                      "source": "NSE",
                      "quoteUpdated": quote_time,
                      "stale": False,
                  }
                  print(
                      f"{symbol} [NSE fallback]: "
                      f"{quotes[symbol]['price']}"
                  )
                  continue
              except Exception as e:
                  print(f"WARNING: {symbol} NSE failed: {e}")
                  errors[symbol] += f" | NSE: {e}"

              try:
                  yahoo_symbol = symbol + ".NS"
                  price, prev_close, sparkline, quote_time = yahoo_quote(
                      yahoo_symbol, interval="1m"
                  )
                  quotes[symbol] = {
                      "price": round(price, 4),
                      "prevClose": round(prev_close, 4),
                      "sparkline": sparkline,
                      "yahooSymbol": yahoo_symbol,
                      "source": "Yahoo fallback",
                      "quoteUpdated": quote_time,
                      "stale": False,
                  }
                  print(
                      f"{symbol} [Yahoo fallback]: "
                      f"{quotes[symbol]['price']} @ {quote_time}"
                  )
                  continue
              except Exception as e:
                  print(f"WARNING: {symbol} Yahoo fallback failed: {e}")
                  errors[symbol] += f" | Yahoo: {e}"

              if symbol in old_quotes:
                  used_stale_fallback = True
                  old = dict(old_quotes[symbol])
                  old["stale"] = True
                  quotes[symbol] = old
                  print(
                      f"STALE: {symbol} using previous saved quote "
                      f"{old.get('price')}"
                  )

          if not quotes:
              raise RuntimeError(
                  "No prices could be obtained and no previous prices exist"
              )

          if used_stale_fallback:
              updated = old_data.get("updated") or utc_now()
          else:
              updated = utc_now()

          output = {
              "updated": updated,
              "generated": utc_now(),
              "quotes": quotes,
          }

          if errors:
              output["errors"] = errors

          Path("prices.json").write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n"
          )

          print()
          print(f"Updated {len(quotes)} symbols")
          print(f"Global price timestamp: {updated}")

          if used_stale_fallback:
              print(
                  "WARNING: At least one old quote was reused. "
                  "Global price timestamp was NOT advanced."
              )

          if errors:
              print(f"Source errors: {len(errors)}")

          PY

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp prices.json /tmp/prices.json

          for attempt in 1 2 3
          do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/prices.json prices.json
            git add prices.json

            if git diff --cached --quiet
            then
              echo "No price changes to commit"
              exit 0
            fi

            git commit -m "Update portfolio prices"

            if git push origin HEAD:main
            then
              echo "Prices successfully pushed"
              exit 0
            fi

            echo "Repository changed during push. Retrying..."
            sleep 3
          done

          echo "Unable to push after 3 attempts"
          exit 1
